<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Trator na Prática | Prof. Leonardo Monteiro</title>
  <meta name="description" content="Checklist gratuito de seguranca com tratores ou parceria de marca com o Prof. Leonardo Monteiro - LIMA/UFC." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0B0F0C" />
  <link rel="canonical" href="https://tratornapratica.com.br/ig" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tratornapratica.com.br/ig" />
  <meta property="og:title" content="Trator na Pratica | Prof. Leonardo Monteiro" />
  <meta property="og:description" content="Checklist gratuito de seguranca ou parceria de marca - escolha seu caminho." />
  <meta property="og:image" content="https://tratornapratica.com.br/og-image.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Trator na Pratica" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YCJ6CCQL4G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YCJ6CCQL4G', { page_path: '/ig' });
    window.addEventListener('load', function(){
      if (typeof gtag === 'function') {
        gtag('event', 'view_ig_bio_link', {
          event_category: 'instagram_bio',
          event_label: 'pageview_ig_hub',
          page_location: window.location.href
        });
      }
    });
    function trackChoice(choice){
      if (typeof gtag === 'function') {
        gtag('event', 'ig_bio_choice', {
          event_category: 'instagram_bio',
          event_label: choice
        });
      }
    }
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{
      font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
      background:#070A08;
      color:#E8ECE7;
      line-height:1.6;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    img{max-width:100%;height:auto;display:block}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

    :root{
      --gold:#F5B800;
      --gold-2:#FFC93C;
      --gold-soft:rgba(245,184,0,.12);
      --text:#E8ECE7;
      --text-dim:#A8B0AB;
      --border:rgba(255,255,255,.10);
      --display:'Oswald','Inter',sans-serif;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:48px 20px;
      background:
        radial-gradient(circle at 80% 10%, rgba(245,184,0,.14), transparent 55%),
        radial-gradient(circle at 10% 95%, rgba(27,77,46,.4), transparent 50%),
        #070A08;
    }

    .card{
      width:100%;
      max-width:460px;
      text-align:center;
    }

    .avatar{
      width:96px;height:96px;border-radius:50%;
      margin:0 auto 18px;overflow:hidden;
      border:3px solid var(--gold);
      box-shadow:0 10px 30px rgba(245,184,0,.25);
    }
    .avatar img{width:100%;height:100%;object-fit:cover}

    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
      font-size:.72rem;color:var(--gold);background:var(--gold-soft);
      border:1px solid rgba(245,184,0,.35);padding:6px 14px;border-radius:100px;margin-bottom:16px;
    }

    h1{
      font-family:var(--display);font-weight:700;text-transform:uppercase;
      font-size:clamp(1.5rem,6vw,2rem);line-height:1.15;letter-spacing:.01em;
      margin-bottom:8px;
    }
    h1 span{color:var(--gold)}

    .sub{
      color:var(--text-dim);
      font-size:.98rem;
      max-width:380px;
      margin:0 auto 34px;
    }

    .choices{
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
    }

    .choice{
      display:flex;
      align-items:center;
      gap:16px;
      padding:20px 22px;
      border-radius:18px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
      text-align:left;
      transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .choice:hover, .choice:active{
      transform:translateY(-2px);
      border-color:var(--gold);
      background:rgba(245,184,0,.06);
    }
    .choice .ico{
      flex-shrink:0;
      width:48px;height:48px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:1.5rem;
    }
    .choice.checklist .ico{background:var(--gold-soft)}
    .choice.brand .ico{background:rgba(46,125,50,.18)}
    .choice-text strong{
      display:block;font-family:var(--display);font-weight:700;
      font-size:1.02rem;text-transform:uppercase;letter-spacing:.01em;
      color:var(--text);margin-bottom:3px;
    }
    .choice.checklist strong{color:var(--gold)}
    .choice.brand strong{color:#7FD98A}
    .choice-text small{color:var(--text-dim);font-size:.82rem;display:block}
    .arrow{margin-left:auto;flex-shrink:0;color:var(--text-dim);font-size:1.2rem}

    footer{
      margin-top:40px;
      text-align:center;
      font-size:.78rem;
      color:var(--text-dim);
    }
    footer a{color:var(--gold);font-weight:600}

    @media (max-width:420px){
      .choice{padding:16px 16px}
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="avatar">
        <img src="/professor.jpg" alt="Prof. Leonardo Monteiro" />
      </div>
      <div class="eyebrow">Prof. Dr. &middot; Coord. LIMA/UFC</div>
      <h1>Trator na <span>Pratica</span></h1>
      <p class="sub">O que voce procura hoje?</p>

      <div class="choices">
        <a class="choice checklist" href="/checklist-seguranca.pdf" onclick="trackChoice('checklist')" target="_blank" rel="noopener">
          <div class="ico">&#128692;</div>
          <div class="choice-text">
            <strong>Checklist gratis de seguranca</strong>
            <small>Baseado em +3.100 acidentes analisados pelo LIMA/UFC</small>
          </div>
          <div class="arrow">&rarr;</div>
        </a>

        <a class="choice brand" href="/para-marcas.html" onclick="trackChoice('marca')">
          <div class="ico">&#129309;</div>
          <div class="choice-text">
            <strong>Sou marca / quero parceria</strong>
            <small>Media kit, audiencia e formatos de publicidade</small>
          </div>
          <div class="arrow">&rarr;</div>
        </a>
      </div>

      <footer>
        Site completo em <a href="/">tratornapratica.com.br</a>
      </footer>
    </div>
  </div>

</body>
</html>
